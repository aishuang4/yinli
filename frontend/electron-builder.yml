appId: com.agentworkstation.desktop
productName: 引力 YINLI
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
directories:
  output: ../../release
  buildResources: ../build
electronDist: ../node_modules/electron/dist
electronVersion: 42.3.3
npmRebuild: false
files:
  - '**/*'
extraResources:
  - from: ../../backend/dist
    to: backend-server
    filter:
      - backend-server
      - backend-server.exe
  - from: ../../config/product-features.json
    to: product-features.json
asar: true
asarUnpack:
  - 'electron-dist/native/**/*.node'
mac:
  icon: icon.icns
  identity: '-'
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  background: dmg-background.png
  icon: icon.icns
  iconSize: 112
  iconTextSize: 13
  title: 引力 YINLI
  window:
    width: 720
    height: 440
  contents:
    - x: 180
      y: 245
    - x: 540
      y: 245
      type: link
      path: /Applications
win:
  icon: icon.ico
  target:
    - nsis
  verifyUpdateCodeSignature: false
nsis:
  include: ../build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish: null
