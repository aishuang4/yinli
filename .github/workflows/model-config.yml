name: 模型配置跨平台回归

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/model-config.yml'

jobs:
  model-config:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: 安装模型配置测试依赖
        working-directory: backend
        run: |
          uv venv
          uv pip install agentscope==2.0.5 fastapi pydantic-settings pytest httpx python-dotenv tzdata uvicorn aiosqlite
      - name: 验证模型绑定、迁移、文件权限和请求目标
        working-directory: backend
        run: uv run --no-sync pytest test/test_model_catalog.py test/test_model_factory.py test/test_secret_store.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 验证前端和 Electron 编译
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run electron:compile
